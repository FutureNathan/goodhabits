<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#060606" />
  <title>Page not found — Good Habits</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #060606;
      --text: #f6f4f1;
      --muted: #9b938a;
      --accent: #ff5a2e;
      --star-off: #4f4c48;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    .starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .starfield i { position: absolute; border-radius: 50%; background: #fff; animation: tw 4s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: var(--o,.5); } 50% { opacity: calc(var(--o,.5) * .25); } }
    .shoot { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; opacity: 0; filter: drop-shadow(0 0 6px rgba(255,255,255,.9)); animation: shoot var(--dur,9s) cubic-bezier(.4,0,.5,1) infinite; animation-delay: var(--delay,0s); }
    .shoot::before { content: ""; position: absolute; left: 2px; top: 50%; width: var(--len,120px); height: 1.5px; background: linear-gradient(90deg, rgba(255,255,255,.85), rgba(255,255,255,0)); transform-origin: left center; transform: translateY(-50%) rotate(var(--tail,200deg)); }
    @keyframes shoot { 0% { opacity: 0; transform: translate(0,0); } 4% { opacity: 1; } 16% { opacity: 1; } 22% { opacity: 0; transform: translate(var(--dx,-360px), var(--dy,210px)); } 100% { opacity: 0; transform: translate(var(--dx,-360px), var(--dy,210px)); } }
    @media (prefers-reduced-motion: reduce) { .shoot { display: none; } .fstar { animation: none !important; } }

    .wrap {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
      padding: 40px 24px;
    }
    h1 { margin: 0; font-size: clamp(58px, 14vw, 110px); font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
    h1 span { color: var(--accent); }
    .sub { margin: 0; color: var(--muted); font-size: clamp(15px, 2.5vw, 18px); max-width: 460px; line-height: 1.5; }

    /* Star-calendar US flag — orange ("on") or gray ("off") only */
    .flag {
      display: grid;
      grid-template-columns: repeat(31, 1fr);
      gap: clamp(2px, 0.55vw, 5px);
      width: min(92vw, 640px);
      margin: 6px 0 2px;
    }
    .fstar {
      aspect-ratio: 1 / 1;
      background: var(--star-off);
      clip-path: polygon(50% 2%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    }
    .fstar.on { background: var(--accent); filter: drop-shadow(0 0 3px rgba(255,90,46,.45)); }

    .flag-caption { margin: 2px 0 0; color: var(--muted); font-size: clamp(13px, 2.2vw, 15px); font-weight: 600; letter-spacing: 0.01em; }
    .flag-caption b { color: var(--accent); font-weight: 700; }

    .btn {
      margin-top: 14px;
      display: inline-block;
      text-decoration: none;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      padding: 13px 24px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(255,90,46,.3);
      transition: transform .12s, filter .15s;
    }
    .btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
    .btn:active { transform: translateY(0) scale(.97); }
  </style>
</head>
<body>
  <div class="starfield" id="starfield" aria-hidden="true"></div>
  <main class="wrap">
    <h1>4<span>0</span>4</h1>
    <p class="sub">This page wandered off the calendar. The star you're looking for isn't here.</p>
    <div class="flag" id="flag" role="img" aria-label="A star-spangled calendar in the shape of the American flag"></div>
    <p class="flag-caption">Made in America with <b>love</b> for all humankind.</p>
    <a class="btn" href="/">Back to your habits</a>
  </main>

  <script>
    (function () {
      // Starfield + shooting stars
      var sf = document.getElementById("starfield");
      if (sf) {
        var W = window.innerWidth, H = window.innerHeight;
        var count = Math.max(40, Math.min(140, Math.round((W * H) / 13000)));
        var html = "";
        for (var i = 0; i < count; i++) {
          var size = Math.random() < 0.82 ? 1 : 2;
          var x = (Math.random() * 100).toFixed(2);
          var y = (Math.random() * 100).toFixed(2);
          var o = (0.25 + Math.random() * 0.6).toFixed(2);
          var delay = (Math.random() * 4).toFixed(2);
          html += "<i style='left:" + x + "%;top:" + y + "%;width:" + size + "px;height:" + size + "px;--o:" + o + ";opacity:" + o + ";animation-delay:" + delay + "s'></i>";
        }
        for (var s = 0; s < 2; s++) {
          var sx = (55 + Math.random() * 40).toFixed(1);
          var sy = (2 + Math.random() * 26).toFixed(1);
          var dx = -Math.round(W * (0.35 + Math.random() * 0.25));
          var dy = Math.round(H * (0.18 + Math.random() * 0.16));
          var tail = (Math.atan2(-dy, -dx) * 180 / Math.PI).toFixed(1);
          var dur = (8 + Math.random() * 5).toFixed(1);
          var dl = (Math.random() * 9).toFixed(1);
          var len = Math.round(90 + Math.random() * 60);
          html += "<span class='shoot' style='left:" + sx + "%;top:" + sy + "%;--dx:" + dx + "px;--dy:" + dy + "px;--tail:" + tail + "deg;--dur:" + dur + "s;--delay:" + dl + "s;--len:" + len + "px'></span>";
        }
        sf.innerHTML = html;
      }

      // Star-calendar US flag: 12 rows (months) x 31 cols (days)
      var flag = document.getElementById("flag");
      if (flag) {
        var ROWS = 12, COLS = 31;
        var cantonRows = 7, cantonCols = Math.round(COLS * 0.42); // union ~ top 7 rows, ~40% wide
        var out = "";
        for (var r = 0; r < ROWS; r++) {
          for (var c = 0; c < COLS; c++) {
            var on;
            if (r < cantonRows && c < cantonCols) {
              on = ((r + c) % 2 === 0);        // star field (the union)
            } else {
              on = (r % 2 === 0);              // alternating stripes
            }
            out += "<div class='fstar" + (on ? " on" : "") + "'></div>";
          }
        }
        flag.innerHTML = out;
      }
    })();
  </script>
</body>
</html>
